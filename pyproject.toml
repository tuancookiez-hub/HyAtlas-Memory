[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyatlas-memory"
version = "3.4.3"
description = "Personal local single-user long-term memory stack for Hermes Agent, forked from Hy-Memory 7-layer cognitive framework (Tencent Hunyuan). Includes experimental L7 intention layer. Apache 2.0 licensed."
readme = "README.md"
license = {file = "LICENSE"}
# Note: long_description_content_type is auto-detected from README.md extension
# (text/markdown). It's not a valid [project] field for setuptools — must not
# be added here, or build will fail validation.
authors = [
    {name = "Maintainer", email = "maintainer@example.com"},
]
keywords = [
    "hermes",
    "hermes-agent",
    "memory",
    "agent",
    "ai",
    "kuzu",
    "vector-store",
    "cognitive-architecture",
    "llm",
    "hy-memory",
    "hyatlas",
    "tencent",
    "hunyuan",
    "openclaw",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

# Runtime deps. The package installs hermes-agent as a peer dep so the
# plugin can register itself with the running Hermes instance.
# kuzu = graph store (L1 raw, L2 fact)
# zvec = in-process vector store (L4 identity search, default since v3.1)
# openai = default LLM/embedder client (overridable via hy_memory.json)
dependencies = [
    # v3.0.0: hy-memory SDK forked into src/hyatlas_memory/core/ — no external dep
    "kuzu>=0.4.0",
    "openai>=1.30.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# v3.1.0+: Zvec is the default (and only) vector store backend.
zvec = ["zvec>=0.5.1"]
# chroma, faiss, and qdrant backends were stripped in v3.0.0/v3.4.
# Embedding server (local SentenceTransformers-based; no API key needed)
# In-process local embedder (integrations.wire_inprocess_embed):
# - sentence-transformers drives the model
# - huggingface-hub must be <1.0 to match transformers 4.46.x
#   (transformers 4.50+ would allow hf-hub 1.x, but 4.46 is what we ship)
# - numpy, torch are pulled in transitively but pinned here for clarity
local-embed = ["sentence-transformers>=2.0.0,<4.0", "huggingface-hub<1.0,>=0.23.2", "uvicorn>=0.27.0", "fastapi>=0.100.0"]
# Dev tooling
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "tomli>=2.0; python_version < '3.11'",
]

# Entry point: Hermes discovers memory providers by the
# `hermes.memory_provider` group. The plugin name is kept as `hy_memory`
# for back-compat with existing user configs.
[project.entry-points."hermes.memory_provider"]
hy_memory = "hyatlas_memory:HyMemoryProvider"

# CLI entry point: `hyatlas start`, `hyatlas stop`, `hyatlas status`
[project.scripts]
hyatlas = "hyatlas_memory.start:main"

[project.urls]
Homepage = "https://github.com/tuancookiez-hub/HyAtlas-Memory"
Issues = "https://github.com/tuancookiez-hub/HyAtlas-Memory/issues"
Source = "https://github.com/tuancookiez-hub/HyAtlas-Memory"
# Reference to the upstream official framework this package implements.
# Not affiliated; included for discoverability and source-of-truth accuracy.
"Upstream Framework" = "https://memory.hunyuan.tencent.com"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hyatlas_memory*"]

# Ship the bundled server (start_server.py + dashboard/) and all static
# assets (HTML, CSS, JS, favicons) inside the wheel so `hyatlas start` works
# from any directory after `pip install hyatlas-memory` — no need to clone
# the repo or set HYATLAS_PROJECT_ROOT. Non-Python files are listed in
# MANIFEST.in; Python files are picked up automatically by packages.find.
[tool.setuptools.package-data]
"hyatlas_memory" = ["py.typed"]
"hyatlas_memory.hermes_plugin_shim" = ["plugin.yaml"]
"hyatlas_memory.server" = ["*.html", "*.css", "*.js", "*.json", "*.yaml", "*.png"]
"hyatlas_memory.server.dashboard" = ["*.html", "*.css", "*.js", "*.png"]
"hyatlas_memory.server.dashboard.js" = ["*.js"]

[tool.setuptools.exclude-package-data]
"hyatlas_memory" = ["_drainer.py", "_local_store.py"]
# v1.4: Hindsight-style direct-upstream writes. The Mnemosyne local-first
# SQLite WAL and background drainer (v1.3.0) are intentionally excluded.

# ----------------------------------------------------------------------
# Pytest config — discover tests in the new layout, not the old fork layout
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests (require running HyAtlas server)",
    "unit: marks unit tests (no external deps)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ----------------------------------------------------------------------
# Ruff config — match the style guide (single-word names, no try/except
# where possible, no `else` after return, etc.)
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # line too long (we use 100 char budget but allow flex)
    "B008",  # function call in default argument (used for sentinels)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports at non-top-level are common in tests
"start.py" = [
    "SIM105",  # try/except/pass is intentional for process management
    "SIM115",  # long-lived log files can't use context managers
]
"src/hyatlas_memory/core/data/*" = [
    "UP035",  # typing.List/Dict/Tuple — forked upstream SDK, uses old-style annotations
    "N802",   # GraphStore() alias — backward compat, can't rename
    "SIM118", # .keys() in — forked upstream style
]
"src/hyatlas_memory/_start.py" = [
    "SIM105",  # try/except/pass is intentional for process management
    "SIM115",  # long-lived log files can't use context managers
]
"src/hyatlas_memory/process.py" = [
    "SIM105",  # try/except/pass is intentional for process management
    "SIM115",  # long-lived lock/log files can't use context managers
]
# Forked hy-memory SDK — upstream style (Chinese comments, single-letter
# variable names, whitespace on blank lines) is inherited, not ours to rewrite.
"src/hyatlas_memory/core/**" = [
    "I001",  # import sorting (upstream groups by Chinese comment sections)
    "F401",  # __init__.py re-exports flagged as "unused" — intentional API surface
    "F841",  # unused locals from upstream defensive patterns
    "W293",  # whitespace on blank lines (upstream editor behavior)
    "N806",  # non-lowercase variable names (upstream uses Chinese pinyin)
    "N803",  # non-lowercase argument names
    "N801",  # non-Pascal class names (upstream uses Chinese pinyin)
    "N814",  # camelcase imported as lowercase
    "E741",  # ambiguous variable names (single-letter upstream style)
    "E701",  # multi-statement on one line (upstream compact style)
    "E702",  # multiple statements on one line (semicolon)
    "B905",  # zip() without explicit strict (upstream predates 3.10+)
    "B007",  # unused loop variable (upstream defensive style)
    "B904",  # raise from (upstream predates this convention)
    "B027",  # empty optional method in ABC (upstream pattern)
    "C416",  # unnecessary comprehension (upstream style)
    "C403",  # unnecessary list comprehension inside set()
    "F541",  # f-string without placeholders (upstream style)
    "SIM105",  # try/except/pass (upstream defensive pattern)
    "SIM102",  # collapsible-if (upstream style)
    "SIM108",  # if-else vs ternary (upstream style)
    "UP007",  # Union[] vs | (upstream predates 3.10+ syntax)
]
"src/hyatlas_memory/cli.py" = [
    "SIM115",  # long-lived log files can't use context managers
]
# server/ files were linted for the first time when they were moved into
# the package (2026-06-20). These pre-existing style issues don't affect
# correctness, so we ignore them rather than churn the file.
"src/hyatlas_memory/server/start_server.py" = [
    "E402",   # imports after env-var setup are intentional
    "F541",   # f-strings without placeholders (style)
    "E501",   # long lines (informational, not a real issue)
    "I001",   # lazy imports after env-var setup are intentional
]
"src/hyatlas_memory/server/dashboard/dashboard.py" = [
    "E402",   # imports after env-var setup are intentional
    "W293",   # whitespace in embedded JS strings
    "SIM102",  # nested if for auth gate is clearer than combining
    "F541",   # f-strings without placeholders (style)
    "E501",   # long lines
    "C401",   # generator rewrite (style)
    "E701",   # multiple statements on one line (style)
    "F821",   # `re` is used in some code paths; ignore for now
]
"src/hyatlas_memory/server/bin/*.py" = [
    "F541",   # f-strings without placeholders (style)
    "E501",   # long lines
    "E402",   # late imports (scripts do runtime sys.path munging)
    "F401",   # unused imports (some scripts have dead branches)
    "W605",   # invalid escape sequences in docstrings
    "C401",   # generator → set comprehension (style)
    "I001",   # import order (style)
    "E701",   # multiple statements on one line (style)
    "B007",   # loop control variable unused (style)
    "F841",   # unused local variables (style)
    "E741",   # ambiguous variable name `l` (style, single-letter)
    "SIM105", # try/except/pass is intentional (scripts do their own cleanup)
    "SIM115", # log files are kept open for subprocess lifetime
    "SIM103", # return-condition is a clarity choice
    "SIM110", # any() is not always clearer
]
"src/hyatlas_memory/server/dashboard/app.js" = [
    "E402",   # N/A — JS file
]
"src/hyatlas_memory/patches.py" = [
    "E402",   # late imports are intentional (lazy loading to avoid circular deps)
    "N814",   # constant aliases for imported names are intentional
    "F821",   # globals()["fast_cfg"] is set dynamically by design
    "SIM102", # nested ifs are clearer for the monkey-patching logic
    "SIM105", # try/except/pass is preferred over contextlib.suppress for readability in patches
]
"src/hyatlas_memory/installer.py" = ["E741"]  # `l` for line is fine in context

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
