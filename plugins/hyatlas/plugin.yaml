name: hyatlas
version: 5.0.0
manifest_version: 2
api_version: 1
description: "HyAtlas memory for Hermes: an 8-layer memory server (hyatlas-go, pure Go, runs on your machine) with four tools (hyatlas_search, hyatlas_recent, hyatlas_add, hyatlas_status), a Desktop pane and a web dashboard. Lite mode makes no LLM call; pro and ultra send memory text to the AI endpoint you configure."
author: Tuna
license: Apache-2.0
homepage: https://github.com/tuancookiez-hub/HyAtlas-Memory
tags: [memory, knowledge-graph, self-hosted, desktop]
requires_hermes: ">=0.21.4"
provides_commands:
  - hyatlas
config_schema:
  # The first five are the `hermes memory setup` questions, in order; the rest are
  # advanced settings, labelled "Advanced:", read and written with `hermes hyatlas
  # settings` and shown here for the Desktop form. The API key is stored by Hermes in
  # .env as HYATLAS_LLM_KEY; the plugin passes it to a server it starts, or hands it
  # over localhost to a server on this machine that is waiting for a key. It is never
  # logged. See the plugin README.
  mode: {type: str, default: "ultra — recommended: one AI call per turn, plus background consolidation, a knowledge graph and patterns", label: "Mode", choices: ["ultra — recommended: one AI call per turn, plus background consolidation, a knowledge graph and patterns", "pro — one AI call per conversation turn to extract facts; nothing runs in the background", "lite — no AI calls at all: everything stays on this machine (local BGE embeddings, keyword + vector search)"], description: "How much should HyAtlas think? (your memories always stay on this machine)"}
  llm_base: {type: str, default: "https://inference-api.nousresearch.com/v1", label: "AI endpoint", description: "AI endpoint (Enter = Nous Portal; not used in lite)"}
  llm_key: {type: str, default: "", label: "AI API key", secret: true, env_var: "HYATLAS_LLM_KEY", description: "API key for that endpoint (saved in Hermes's .env; Enter to skip in lite)"}
  llm_model: {type: str, default: "meituan/longcat-2.5-preview:free", label: "AI model", description: "Model (Enter = a free Nous Portal model; not used in lite)"}
  auto_start: {type: str, default: "n", label: "Auto-start server", description: "Auto-start the HyAtlas server with Hermes? (y/N)"}
  sync: {type: str, default: "default", label: "Advanced: block on extraction", choices: ["default", "on", "off"], description: "Advanced: wait for extraction before a reply finishes?"}
  server_host: {type: str, default: "127.0.0.1", label: "Advanced: server address", description: "Advanced: where the HyAtlas server runs"}
  server_port: {type: int, default: 19528, label: "Advanced: server port", description: "Advanced: server port"}
  user_id: {type: str, default: "default", label: "Advanced: user ID", description: "Advanced: whose memories these are"}
  agent_id: {type: str, default: "default", label: "Advanced: agent ID", description: "Advanced: default agent name"}
  binary_path: {type: str, default: "", label: "Advanced: binary path", description: "Advanced: path to hyatlas-go (empty = find it on PATH)"}
  launcher_path: {type: str, default: "", label: "Advanced: launcher script", description: "Advanced: Windows launcher script (empty = run the binary)"}
  data_dir: {type: str, default: "", label: "Advanced: data folder", description: "Advanced: server data folder (empty = the usual default)"}
  request_timeout: {type: float, default: 15.0, label: "Advanced: request timeout (s)", description: "Advanced: seconds to wait for the server"}
