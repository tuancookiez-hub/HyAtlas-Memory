name: hyatlas
version: 4.3.3
manifest_version: 2
api_version: 1
description: "HyAtlas v4 memory for Hermes: a 7-layer memory server (hyatlas-go, pure Go, runs on your machine) with four tools (hyatlas_status, hyatlas_search, hyatlas_recent, hyatlas_add), a Desktop pane and a web dashboard. Lite mode makes no LLM call; pro and ultra send memory text to the LLM endpoint you configure."
author: Tuna
license: Apache-2.0
homepage: https://github.com/tuancookiez-hub/HyAtlas-Memory
tags: [memory, knowledge-graph, self-hosted, desktop]
requires_hermes: ">=0.21.4"
provides_commands:
  - hyatlas
config_schema:
  server_host: {type: str, default: "127.0.0.1", label: "Server host", description: "HyAtlas v4 server host"}
  server_port: {type: int, default: 19528, label: "Server port", description: "HyAtlas v4 server port"}
  user_id: {type: str, default: "default", label: "User ID", description: "Default user_id for memory scoping"}
  agent_id: {type: str, default: "default", label: "Agent ID", description: "Default agent_id (overridden by agent identity per session)"}
  auto_start: {type: bool, default: false, label: "Auto-start server", description: "Spawn the hyatlas-go binary when the server is unreachable"}
  binary_path: {type: str, default: "", label: "Binary path", description: "Path to hyatlas-go (empty = discover from PATH)"}
  launcher_path: {type: str, default: "", label: "Launcher script", description: "Windows only. Optional hyatlas-go.ps1 that `hermes hyatlas start|stop` runs instead of spawning the binary. Run as given, so only point it at a script you trust. Empty = spawn the binary directly."}
  request_timeout: {type: float, default: 15.0, label: "Request timeout (s)", description: "HTTP timeout for server calls"}
  data_dir: {type: str, default: "", label: "Data directory", description: "Server data directory (vector store, graph). Passed to a spawned server as HYATLAS_GO_DATA and used by `hermes backup`. Empty = HYATLAS_GO_DATA, then the conventional defaults."}
  llm_base: {type: str, default: "", label: "LLM endpoint", description: "Base URL of any OpenAI-compatible chat-completions API, used for fact extraction and (in ultra) consolidation. Forwarded to the server as HYATLAS_LLM_BASE. Not used in lite mode, which makes no LLM call. Leave empty to use the server's default."}
  llm_model: {type: str, default: "", label: "LLM model", description: "Model id at that endpoint, e.g. a `:free` tier. Forwarded as HYATLAS_LLM_MODEL. Leave empty for the server default."}
  llm_key: {type: str, default: "", label: "LLM API key", secret: true, env_var: "HYATLAS_LLM_KEY", url: "https://platform.openai.com/api-keys", description: "API key for the endpoint above. The setup wizard stores it in Hermes' .env (0600) as HYATLAS_LLM_KEY, never in hyatlas.json. The plugin never reads or logs it. Not needed in lite mode."}
  mode: {type: str, default: "", label: "Extraction mode", choices: ["", "lite", "pro", "ultra"], description: "Passed to a spawned server as HYATLAS_MODE. lite makes no LLM call, so no conversation text goes to an LLM; pro sends each write to the LLM endpoint and reasons within that turn; ultra also runs a periodic consolidation pass over stored facts. Empty = the server's own default (ultra). The server's /api/v1/status `mode` field is authoritative at runtime, since a manually started server may differ."}
  sync: {type: str, default: "", label: "Block on extraction", choices: ["", "on", "off"], description: "Passed to a spawned server as HYATLAS_SYNC_EXTRACT. on makes the write wait for extraction and report done or failed; off returns immediately and extracts behind it. Empty means off for a server this plugin spawns, so a Hermes turn never waits on the LLM. This is a latency choice and does not change what the mode can reason about."}
