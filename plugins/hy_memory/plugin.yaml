name: hy_memory
version: 4.0.0
description: "HyAtlas v4.0 — pure-Go 7-layer memory backend (chromem-go + in-process BGE-small via onnxruntime-go). Wire-compatible with the v3.5 HyMemoryClient; runs against the Go binary at 127.0.0.1:19528."
author: Tuna
license: Apache-2.0
homepage: https://github.com/tuancookiez-hub/HyAtlas-Memory
pip_dependencies: []
requires_env:
  - HYATLAS_SERVER_HOST
  - HYATLAS_SERVER_PORT
hooks:
  - on_session_end
  - on_pre_compress
  - on_memory_write
provides_tools:
  - hyatlas_status
  - hyatlas_search
  - hyatlas_recent
  - hyatlas_add
provides_commands:
  - hyatlas
