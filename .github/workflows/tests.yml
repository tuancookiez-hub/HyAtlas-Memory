name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Go 1.26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Download modules
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: Build (embedded)
        run: go build -tags embedded -o /tmp/hyatlas-go .
      - name: Build (plain)
        run: go build -o /tmp/hyatlas-go-plain .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyatlas-go-binaries
          path: /tmp/hyatlas-go*
