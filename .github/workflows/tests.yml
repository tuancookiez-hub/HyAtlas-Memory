name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-plain:
    name: Build (Go 1.26, plain — Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Download modules
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Build (plain — no embedded tag)
        run: go build -o /tmp/hyatlas-go-plain .
      - name: Smoke test (server boots and serves /healthz)
        run: |
          set -e
          # Start the server with a fake LLM endpoint; VDB + embed should be ok,
          # LLM will be reported degraded, but /healthz (liveness) must return 200.
          HYATLAS_LLM_BASE=http://127.0.0.1:1/v1 \
          HYATLAS_LLM_MODEL=fake-model \
          HYATLAS_LLM_KEY=ci-key \
          /tmp/hyatlas-go-plain &
          SERVER_PID=$!
          sleep 4
          if curl -fsS http://127.0.0.1:19528/healthz > /tmp/healthz.txt; then
            echo "OK /healthz:"
            cat /tmp/healthz.txt
          else
            echo "FAIL /healthz (exit $?)"
            cat /tmp/healthz.txt 2>/dev/null || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          if curl -fsS http://127.0.0.1:19528/api/v1/status > /tmp/status.json; then
            echo "OK /api/v1/status:"
            cat /tmp/status.json
          else
            echo "FAIL /api/v1/status (exit $?)"
            cat /tmp/status.json 2>/dev/null || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          kill $SERVER_PID 2>/dev/null || true
          sleep 1
      - name: Upload artifact (plain)
        uses: actions/upload-artifact@v7
        with:
          name: hyatlas-go-plain
          path: /tmp/hyatlas-go-plain

  build-embedded-smoke:
    name: Build (embedded — verify go:embed compiles per OS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Download modules
        run: go mod download
      - name: Create stub model files for go:embed verification
        shell: bash
        run: |
          mkdir -p models
          # 1-byte stub files — the embedded build only needs them to exist for
          # go:embed; the full BGE-small model is 133 MB and is bundled into
          # release artifacts separately, not committed to the repo.
          : > models/bge-small-en-v1.5.onnx
          : > models/bge-small-en-v1.5.onnx.data
          : > models/vocab.txt
          # The platform-matching shared library name is what the build
          # actually looks for via go:embed. Stub that too.
          if [ "$RUNNER_OS" = "Windows" ]; then
            : > models/onnxruntime.dll
          elif [ "$RUNNER_OS" = "macOS" ]; then
            : > models/libonnxruntime.dylib
          else
            : > models/libonnxruntime.so
          fi
          ls -la models/
      - name: go vet
        run: go vet ./...
      - name: Build (embedded — verifies go:embed directives are correct)
        shell: bash
        run: go build -tags embedded -o hyatlas-go-embedded .
      - name: Upload artifact (embedded)
        uses: actions/upload-artifact@v7
        with:
          name: hyatlas-go-embedded-${{ matrix.os }}
          path: hyatlas-go-embedded

  lint:
    name: Lint (go vet + formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Files not gofmt-clean:"
            gofmt -l .
            exit 1
          fi
      - name: go mod tidy verify
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only -- go.mod go.sum)" ]; then
            echo "go.mod or go.sum changed after 'go mod tidy' — commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi

  plugin-tests:
    name: Plugin tests (hyatlas provider — no live server needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test deps + hermes-agent wheel (stdlib-only ABC import)
        run: |
          python -m pip install -q pytest pyyaml
          # The plugin imports only `agent.memory_provider` (pure stdlib ABC).
          # Extract that module from the published wheel instead of installing
          # the full Hermes dependency tree.
          python -m pip download -q hermes-agent==0.19.0 --no-deps -d /tmp/ha-wheel
          python - <<'EOF'
          import glob, zipfile
          zipfile.ZipFile(glob.glob('/tmp/ha-wheel/*.whl')[0]).extractall('/tmp/ha-pkg')
          EOF
          echo "/tmp/ha-pkg" >> "$GITHUB_PATH"
          echo "PYTHONPATH=/tmp/ha-pkg" >> "$GITHUB_ENV"
      - name: pytest plugins/hyatlas
        run: python -m pytest plugins/hyatlas/tests/ -q
      - name: Standalone smoke runner
        run: python plugins/hyatlas/tests/test_smoke.py