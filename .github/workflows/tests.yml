name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install hermes-agent from PyPI so the plugin can import from it
          # (this is the same dependency real users have).
          pip install hermes-agent || echo "::warning::hermes-agent not on PyPI; skipping plugin-import test"
          # Editable install of this package
          pip install -e ".[test]"

      - name: Run pytest (unit tests only)
        run: |
          # Integration tests require live Qdrant + hy-memory server
          # which aren't available in CI. Run unit tests only.
          pytest -v -m "not integration" --ignore=tests/test_integration.py

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/
          ruff format --check src/ tests/
