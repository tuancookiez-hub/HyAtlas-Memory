name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-plain:
    name: Build (Go 1.26, plain — Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Download modules
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Build (plain — no embedded tag)
        run: go build -o /tmp/hyatlas-go-plain .
      - name: Smoke test (server boots and serves /healthz)
        run: |
          set -e
          # A plain build carries no embedded model, so it cannot use the default
          # embedder ("bge"), which needs models/ or -tags embedded. Selecting the
          # deterministic offline stub is the honest option for a binary that ships
          # none: letting it fall back to bge silently would produce fake
          # embeddings, and refusing to boot is the correct behaviour. release.yml
          # smoke-tests the embedded build against real bge, so both paths stay
          # covered across the two workflows.
          #
          # The LLM endpoint is fake on purpose — /healthz is liveness only, and
          # the LLM is expected to report degraded.
          HYATLAS_EMBED_BASE=local \
          HYATLAS_LLM_BASE=http://127.0.0.1:1/v1 \
          HYATLAS_LLM_MODEL=fake-model \
          HYATLAS_LLM_KEY=ci-key \
            /tmp/hyatlas-go-plain > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          # Poll instead of sleeping a fixed interval: when the server refuses to
          # boot it exits at once, and its own log is the only evidence of why.
          # A fixed sleep hides that and reports a bare connection-refused.
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:19528/healthz > /tmp/healthz.txt 2>/dev/null; then
              READY=1
              echo "healthz OK after $i tries"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::server exited before serving /healthz"
              cat /tmp/server.log
              exit 1
            fi
            sleep 0.5
          done
          if [ "$READY" != "1" ]; then
            echo "::error::server did not become healthy within 20s"
            cat /tmp/server.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "OK /healthz:"
          cat /tmp/healthz.txt
          if ! curl -fsS http://127.0.0.1:19528/api/v1/status > /tmp/status.json; then
            echo "::error::/api/v1/status failed"
            cat /tmp/server.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "OK /api/v1/status:"
          cat /tmp/status.json
          kill $SERVER_PID 2>/dev/null || true
          sleep 1
      - name: Upload artifact (plain)
        uses: actions/upload-artifact@v7
        with:
          name: hyatlas-go-plain
          path: /tmp/hyatlas-go-plain

  build-embedded-smoke:
    name: Build (embedded — verify go:embed compiles per OS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Download modules
        run: go mod download
      - name: Create stub model files for go:embed verification
        shell: bash
        run: |
          mkdir -p models
          # 1-byte stub files — the embedded build only needs them to exist for
          # go:embed; the full BGE-small model is 133 MB and is bundled into
          # release artifacts separately, not committed to the repo.
          : > models/bge-small-en-v1.5.onnx
          : > models/bge-small-en-v1.5.onnx.data
          : > models/vocab.txt
          # The platform-matching shared library name is what the build
          # actually looks for via go:embed. Stub that too.
          if [ "$RUNNER_OS" = "Windows" ]; then
            : > models/onnxruntime.dll
          elif [ "$RUNNER_OS" = "macOS" ]; then
            : > models/libonnxruntime.dylib
          else
            : > models/libonnxruntime.so
          fi
          ls -la models/
      - name: go vet
        run: go vet ./...
      - name: Build (embedded — verifies go:embed directives are correct)
        shell: bash
        run: go build -tags embedded -o hyatlas-go-embedded .
      - name: Upload artifact (embedded)
        uses: actions/upload-artifact@v7
        with:
          name: hyatlas-go-embedded-${{ matrix.os }}
          path: hyatlas-go-embedded

  lint:
    name: Lint (go vet + formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Files not gofmt-clean:"
            gofmt -l .
            exit 1
          fi
      - name: go mod tidy verify
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only -- go.mod go.sum)" ]; then
            echo "go.mod or go.sum changed after 'go mod tidy' — commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi

  plugin-tests:
    name: Plugin tests (hyatlas provider — no live server needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test deps + hermes-agent wheel (stdlib-only ABC import)
        run: |
          python -m pip install -q pytest pyyaml
          # The plugin imports only `agent.memory_provider` (pure stdlib ABC).
          # Extract that module from the published wheel instead of installing
          # the full Hermes dependency tree.
          python -m pip download -q hermes-agent==0.19.0 --no-deps -d /tmp/ha-wheel
          python - <<'EOF'
          import glob, zipfile
          zipfile.ZipFile(glob.glob('/tmp/ha-wheel/*.whl')[0]).extractall('/tmp/ha-pkg')
          EOF
          echo "/tmp/ha-pkg" >> "$GITHUB_PATH"
          echo "PYTHONPATH=/tmp/ha-pkg" >> "$GITHUB_ENV"
      - name: pytest plugins/hyatlas
        run: python -m pytest plugins/hyatlas/tests/ -q
      - name: Standalone smoke runner
        run: python plugins/hyatlas/tests/test_smoke.py