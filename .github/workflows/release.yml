name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach assets to (e.g. v4.2.0). Build uses the triggering ref's source."
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_os }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_os: linux
            goarch: amd64
            lib: libonnxruntime.so
            ort_pkg: linux-x64
            ext: ""
          - os: macos-latest
            asset_os: macos
            goarch: arm64
            lib: libonnxruntime.dylib
            ort_pkg: osx-arm64
            ext: ""
          - os: windows-latest
            asset_os: windows
            goarch: amd64
            lib: onnxruntime.dll
            ort_pkg: win-x64
            ext: ".exe"
    env:
      # workflow_dispatch runs on a branch, so github.ref_name is the branch
      # name, not the tag — the || operator would never reach inputs.tag.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Download modules
        run: go mod download

      - name: Fetch BGE-small ONNX model (~133 MB)
        shell: bash
        run: |
          mkdir -p models
          # Xenova/bge-small-en-v1.5 ships a self-contained ONNX model.
          curl -fsSL --retry 3 -o models/bge-small-en-v1.5.onnx \
            "https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/main/onnx/model.onnx"
          curl -fsSL --retry 3 -o models/vocab.txt \
            "https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/main/vocab.txt"
          # Empty .data sidecar — self-contained ONNX exports don't need it,
          # but the embedded build's go:embed directive requires the file.
          : > models/bge-small-en-v1.5.onnx.data
          ls -la models/

      - name: Fetch onnxruntime shared library (${{ matrix.asset_os }})
        shell: bash
        env:
          ORT_VERSION: "1.28.1"
          ORT_PKG: ${{ matrix.ort_pkg }}
        run: |
          set -euo pipefail
          url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-${ORT_PKG}-${ORT_VERSION}"
          case "${{ matrix.asset_os }}" in
            windows)
              curl -fsSL --retry 3 -o ort.zip "${url}.zip"
              unzip -o -q ort.zip
              cp "onnxruntime-${ORT_PKG}-${ORT_VERSION}/lib/onnxruntime.dll" models/
              ;;
            macos)
              curl -fsSL --retry 3 -o ort.tgz "${url}.tgz"
              tar -xzf ort.tgz
              cp "onnxruntime-${ORT_PKG}-${ORT_VERSION}/lib/libonnxruntime.dylib" models/
              ;;
            linux)
              curl -fsSL --retry 3 -o ort.tgz "${url}.tgz"
              tar -xzf ort.tgz
              cp "onnxruntime-${ORT_PKG}-${ORT_VERSION}/lib/libonnxruntime.so" models/
              ;;
          esac
          ls -la models/

      - name: Build (embedded, platform-native)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          go build -tags embedded \
            -o "hyatlas-go-${RELEASE_TAG}-${{ matrix.asset_os }}-${{ matrix.goarch }}${{ matrix.ext }}" .
          ls -la

      - name: Smoke test the built binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="hyatlas-go-${RELEASE_TAG}-${{ matrix.asset_os }}-${{ matrix.goarch }}${{ matrix.ext }}"
          PORT=19599
          DATA="$(mktemp -d)"
          # Start with a dead LLM endpoint on purpose: server must still boot
          # and serve /healthz (vdb + embed healthy, llm degraded).
          #
          # MODEL_DIR points at the model this job just fetched, i.e. the exact
          # model the embedded build carries. That is deliberate: the two BERT
          # exports disagree about token_type_ids (the CI one declares it, the
          # dev one does not), and a session built for the wrong input set fails
          # at the first embedding rather than at load. Booting proves nothing
          # about that, so this test must write.
          HYATLAS_GO_PORT="$PORT" \
          HYATLAS_GO_DATA="$DATA" \
          HYATLAS_EMBED_BASE=bge \
          HYATLAS_MODEL_DIR="$PWD/models" \
          HYATLAS_LLM_BASE="http://127.0.0.1:1/v1" \
          HYATLAS_LLM_MODEL=probe \
          HYATLAS_LLM_KEY=probe \
            "./$BIN" >/dev/null 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; rm -rf "$DATA"' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then
              echo "healthz OK after ${i} tries"
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::binary did not become healthy within 20s"
            exit 1
          fi
          echo "status: $(curl -fsS "http://127.0.0.1:$PORT/api/v1/status")"

          # A write is the only thing that proves the embedder works end to end:
          # it embeds the document, and the search below embeds the query. When
          # the onnxruntime input set is wrong, both return 500 while /healthz
          # stays green -- which is how a build that could not store a single
          # memory passed this job once already.
          #
          # Bodies are captured in shell variables rather than temp files: this
          # job runs under bash on three OSes, and `curl -o` with an MSYS-style
          # temp path only resolves when the shell happens to translate it.
          ADD_OUT="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -X POST "http://127.0.0.1:$PORT/api/v1/add" \
            -H 'Content-Type: application/json' \
            -d '{"text":"release smoke test memory about cobalt","user_id":"smoke","agent_id":"smoke"}')"
          ADD_CODE="${ADD_OUT##*HTTP_STATUS:}"
          ADD_BODY="${ADD_OUT%HTTP_STATUS:*}"
          if [ "$ADD_CODE" != "200" ]; then
            echo "::error::POST /api/v1/add returned $ADD_CODE, expected 200"
            echo "$ADD_BODY"
            exit 1
          fi
          echo "write OK"

          SEARCH_OUT="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -X POST "http://127.0.0.1:$PORT/api/v1/search" \
            -H 'Content-Type: application/json' \
            -d '{"query":"cobalt","limit":5,"user_ids":["smoke"],"agent_ids":["smoke"]}')"
          SEARCH_CODE="${SEARCH_OUT##*HTTP_STATUS:}"
          SEARCH_BODY="${SEARCH_OUT%HTTP_STATUS:*}"
          if [ "$SEARCH_CODE" != "200" ]; then
            echo "::error::POST /api/v1/search returned $SEARCH_CODE, expected 200"
            echo "$SEARCH_BODY"
            exit 1
          fi
          case "$SEARCH_BODY" in
            *cobalt*) echo "search OK (write was recalled)" ;;
            *) echo "::error::search returned 200 but the written memory was not recalled"
               echo "$SEARCH_BODY"
               exit 1 ;;
          esac

          kill $PID 2>/dev/null || true
          rm -rf "$DATA"
          trap - EXIT
          exit 0

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: hyatlas-go-${{ env.RELEASE_TAG }}-${{ matrix.asset_os }}-${{ matrix.goarch }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
